<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html,
        body {
            height: 100%;
            width: 100%;
        }
        
        #main {
            padding: 30px;
            width: 100%;
            height: 200%;
            background-color: #222;
        }
        
        h1 {
            color: #555;
            font-size: 10rem;
            font-family: sans-serif;
            font-weight: 300;
            user-select: none;
            /* Prevent text selection off */
        }
        
        input {
            display: block;
        }
        
        #btn {
            padding: 12px 22px;
            background-color: #555;
            color: #888686;
            font-size: 1.5rem;
            border-radius: 30rem;
        }
        
        #btn:hover {
            background-color: #3d3c3c;
            color: #827e7e;
        }
        
        .card {
            color: #fff;
            max-width: 300px;
            margin: 40px;
            border-radius: 10px;
            display: inline-block;
            padding: 20px;
            border: 1px solid #666464;
        }
        
        .profile {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-bottom: 7px;
            overflow: hidden;
        }
        
        .card h5 {
            margin-top: 3px;
        }
        
        .profile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .card p {
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div id="main">
        <form action="">
            <input type="text" placeholder="Profile pic">
            <input type="text" placeholder="name">
            <input type="text" placeholder="Occupation">
            <input type="text" placeholder="info">
            <input type="submit">
        </form>
