<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html,
        body {
            height: 100%;
            width: 100%;
        }
        
        #main {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background-color: #222;
        }
        
        h1 {
            color: #555;
            font-size: 10rem;
            font-family: sans-serif;
            font-weight: 300;
            user-select: none;
            /* Prevent text selection off */
        }
    </style>
</head>

<body>


    <div id="main">
        <h1>a</h1>

    </div>


    <div></div>





    <h1>Events And Handling</h1>
    <p>Click the button to see the event handling in action.</p>



    <h2>Event Handling input</h2>
    <input type="text" placeholder="name">



    <h3 id="device">Select your Device:</h3>
    <select>
        <option selected disabled>Choose your Device</option>
        <option value="mobile">Mobile</option>
        <option value="laptop">Laptop</option>
        <option value="tablet">Tablet</option>
    </select>
    <script src="Events&Handling.js"></script>
</body>

</html>
