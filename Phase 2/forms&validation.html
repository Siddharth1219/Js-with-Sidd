<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        small {
            color: red;
            font-size: 12px;
        }
        
        #hide {
            display: none;
        }
    </style>
</head>

<body>

    <form>
        <input required minlength="2" maxlength="10" id="name" type="text" placeholder="Enter your name"><br>
        <!-- required is used in inline validation. -->
        <div id="hide">
            <small>Your name must be at least 2 characters long.</small><br>

        </div>
        <input type="email" placeholder="Enter your email"><br>
        <input type="password" placeholder="Enter your password"><br>
        <select>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="others">Other</option>
        </select><br>
        <textarea placeholder="Tell us about yourself"></textarea>

        </textarea>
        <br> <input type="submit" value="Submit">
    </form>








    <script src="formsandvalidation.js"></script>
</body>

</html>
